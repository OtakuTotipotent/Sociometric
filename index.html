<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sociometric</title>

  <!-- Images -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon.png">

  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />
  <link rel="stylesheet" href="./dist/style.css">
  <script src="./dist/script.js" defer></script>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Prefix style for links -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <header class="header container">
    <div class="header__title">
      <h1>Social Media Tracking System</h1>
      <span class="header__subtitle">Total Leads: 200k</span>
    </div>

    <fieldset class="header__toggle toggle" aria-label="theme toggle" role="radiogroup">
      <div class="toggle__wrapper">
        <input type="radio" name="theme" id="dark" />
        <input type="radio" name="theme" id="system" checked />
        <input type="radio" name="theme" id="light" />

        <span aria-hidden="true" class="toggle__background"></span>
        <span aria-hidden="true" class="toggle__button"></span>
      </div>

      <label for="dark">Dark</label>
      <label for="system">System</label>
      <label for="light">Light</label>
    </fieldset>
  </header>

  <main>
    <section class="container">
      <div class="card">
        <div class="card__platform">
          <i class="card__icon fa-brands fa-square-facebook"></i>
          <div class="card__username">@sapienswhisper</div>
        </div>

        <div class="card__count card__count--bg">
          998
          <div class="card__label">Followers</div>
        </div>

        <div class="card__change">Today: 12</div>
      </div>
    </section>
  </main>

</body>

</html>
